name: Feature request
description: Suggest something tinyterm should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or workflow, and where tinyterm gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: details
    attributes:
      label: Anything else
      description: Devices, protocols, other tools that do it well, screenshots.
